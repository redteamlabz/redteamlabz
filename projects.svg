<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e8c6"/>
      <stop offset="0.72" stop-color="#00e8c6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff2020" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="130" rx="11" fill="#0d1117" stroke="#26313a"/>
  <rect x="0" y="0" width="8" height="132" rx="4" fill="#00e8c6"/>
  <rect x="8" y="0" width="4" height="132" fill="#ff2020" opacity="0.9"/>

  <text x="34" y="38" fill="#00e8c6"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace"
        font-size="18" font-weight="700">┌─[ethan@redteamlabz]─[~/projects]</text>

  <text x="34" y="76" fill="#f4f7f8"
        font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace"
        font-size="20" font-weight="700">└──╼ $ ls -la</text>

  <rect x="34" y="99" width="620" height="2" fill="url(#line)">
    <animate attributeName="width" values="140;620;360;620" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text x="1165" y="75" text-anchor="end" fill="#6b7680"
        font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800"
        letter-spacing="3">SELECTED PROJECTS</text>

  <circle cx="1142" cy="29" r="4" fill="#ff2020" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <rect x="212" y="58" width="11" height="22" fill="#00e8c6">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>